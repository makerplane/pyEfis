instruments:
  - type: virtual_vfr
    row: 0
    column: 0
    span:
      rows: 110
      columns: 155
    options:
      font_percent: 0.025
      # Synthetic Vision (terrain + water/roads overlays + airport/runway and
      # obstacle symbology) is OFF by default. To turn it on, uncomment the
      # block below. The SVS only renders when an `svs:` block is present AND
      # `enabled: true` -- without it the attitude view shows sky/ground only.
      # Paths assume the makerplane-data updater's standard Pi data root
      # (/data/makerplane-data); adjust if your data root differs. Install the
      # data from the on-EFIS Update screen or `pyefis-data update`.
      # svs:
      #   enabled: true
      #   range_nm: 30
      #   tile_path: /data/makerplane-data/terrain/tiles
      #   nasr_db_path: /data/makerplane-data/navdata/current/airports.sqlite
      #   # Supplemental airport providers (e.g. airports-canada from
      #   # OurAirports) merge with the US NASR primary above. Auto-discovers
      #   # every <dir>/*/current/airports.sqlite, so a new provider pack needs
      #   # no config change.
      #   airport_provider_dir: /data/makerplane-data/airports
      #   dof_db_path: /data/makerplane-data/obstacles/current/obstacles.sqlite
      #   water_db_path: /data/makerplane-data/water/current/water.sqlite
      #   highway_db_path: /data/makerplane-data/highways/current/highways.sqlite
      #   # Render vertex cap per water polygon. MUST match the published
      #   # pack's build cap or stored triangles won't align -- the current
      #   # water-na pack is built at 1024 (dendritic reservoirs render as
      #   # branches, not blobs). Lower values re-decimate and lose detail.
      #   water_max_vertices: 1024
  - type: horizontal_situation_indicator
    disabled: HSI
    row: 0
    column: 0
    span:
      rows: 110
      columns: 155
    move:
      shrink: 12
    options:
      #fontSize: 48
      font_percent: 0.05
      #fg_color: "#aaaaaa"
      bg_color: "#aaaaaa"
      cdi_enabled: true
      gsi_enabled: true
  - type: altimeter_tape
    row: 0
    column: 140
    span:
      rows: 110
      columns: 15
    options:
      #fontsize: 28
      font_percent: 0.24
      #number_font_size: 40
      altitude: true
      majorDiv: 100
      font_scale: 1.1
  - type: vsi_pfd
    disabled: VSI_BALL
    row: 0
    column: 130
    span:
      rows: 50
      columns: 10
  - type: numeric_display
    disabled: VSI_BALL
    row: 50
    column: 128.5
    span:
      rows: 5
      columns: 12
    options:
      font_mask: "0000"
      decimal_places: 0
      dbkey: VS
  - type: altimeter_tape
    disabled: VSI_TAPE
    row: 30
    column: 127
    span:
      rows: 50
      columns: 13
    options:
      dbkey: VS
      font_mask: "00000"
      total_decimals: 5
      altitude: true
      majorDiv: 200
      minorDiv: 200
      round_to: 50
      numeric_box: false
      font_scale: 1.45
  - type: airspeed_tape
    row: 5
    column: 0
    span:
      rows: 100
      columns: 15
    options:
      font_percent: 0.25
  - type: wind_display
    disabled: WIND_DISPLAY
    row: 6
    column: 15
    span:
      rows: 14
      columns: 22
  - type: include,includes/bars/vertical/dimmer_control.yaml
    disabled: DIMMER
    row: 90
    column: 112
    span:
      rows: 20
      columns: 6
  - type: heading_display
    disabled: HEADING
    row: 0
    column: 72.5
    span:
      rows: 7
      columns: 10
    options:
      bg_color: "#00000000"
      fg_color: "#FFFFFF"
      #fontSize: 5 #47
      #font_percent: 0.65
  - type: static_text
    disabled: AUTO_PILOT
    row: 0
    column: 0
    span:
      rows: 5
      columns: 22
    options:
      text: "Auto Pilot:"
      alignment: AlignRight
      font_mask: "Auto_Pilot:"
  - type: value_text
    disabled: UTC_TIME
    row: 0
    column: 97
    span:
      rows: 5
      columns: 35
    options:
      dbkey: TIMEZ
      font_mask: "HH:MM:SS ZZZ"
      #fontName: DSEG14 Modern Mini, Bold
  - type: value_text
    disabled: LOCAL_TIME
    row: 5
    column: 97
    span:
      rows: 5
      columns: 35
    options:
      dbkey: TIMEL
      font_mask: "HH:MM:SS ZZZ"
  - type: value_text
