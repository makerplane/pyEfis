# AHRS bundle -- Synthetic Vision (SVS) variant.
#
# Cloned from virtual_vfr.yaml for the PFD_AI_ONLY (SVS-focused) screen so the
# shared virtual_vfr.yaml stays untouched for the standard PFD. Differences:
#   * This screen carries the Synthetic Vision (svs) block. SVS ships DISABLED
#     by default so a fresh install boots to the standard sky/ground attitude
#     with no dependency on terrain data existing. To use SVS, set
#     `enabled: true` below and point the paths at your data root. The paths
#     default to the makerplane-data updater's standard Pi root
#     (/data/makerplane-data); on a laptop set them to a directory you control.
#     (On a Pi provisioned from the configurator, the updater injects the svs
#     block for you, so this default does not affect managed installs.)
#   * The HSI, the "Auto Pilot:" status line (label + MAVMSG message), and the
#     UTC/local time readouts are removed for a cleaner synthetic-vision view.
instruments:
  - type: virtual_vfr
    row: 0
    column: 0
    span:
      rows: 110
      columns: 155
    options:
      font_percent: 0.025
      # Synthetic Vision (terrain + water/roads overlays + airport/runway and
      # obstacle symbology). Disabled by default -- see the header note. The SVS
      # only renders when an `svs:` block is present AND `enabled: true`, a
      # supported GPU is available, and the data paths below resolve. With no
      # usable GPU/driver (or absent data) SVS disables itself and the view
      # reverts to sky/ground with an SVS UNAVAIL annunciation. To turn it on,
      # set `enabled: true` and adjust the paths to your data root.
      svs:
        enabled: false
        range_nm: 30
        tile_path: /data/makerplane-data/terrain/tiles
        nasr_db_path: /data/makerplane-data/navdata/current/airports.sqlite
        # Supplemental airport providers (e.g. airports-canada from
        # OurAirports) merge with the US NASR primary above. Auto-discovers
        # every <dir>/*/current/airports.sqlite, so a new provider pack needs
        # no config change.
        airport_provider_dir: /data/makerplane-data/airports
        dof_db_path: /data/makerplane-data/obstacles/current/obstacles.sqlite
        water_db_path: /data/makerplane-data/water/current/water.sqlite
        highway_db_path: /data/makerplane-data/highways/current/highways.sqlite
        # Render vertex cap per water polygon. MUST match the published pack's
        # build cap or stored triangles won't align -- the current water-na
        # pack is built at 1024 (dendritic reservoirs render as branches, not
        # blobs). Lower values re-decimate and lose detail.
        water_max_vertices: 1024
  - type: altimeter_tape
    row: 0
    column: 140
    span:
      rows: 110
      columns: 15
    options:
      #fontsize: 28
      font_percent: 0.24
      #number_font_size: 40
      altitude: true
      majorDiv: 100
      font_scale: 1.1
  - type: vsi_pfd
    disabled: VSI_BALL
    row: 0
    column: 130
    span:
      rows: 50
      columns: 10
  - type: numeric_display
    disabled: VSI_BALL
    row: 50
    column: 128.5
    span:
